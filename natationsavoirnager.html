<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPS Natation : Savoir Nager 2026-2027</title>
<style>
  :root{
    --c1:#2563eb; --c2:#7c3aed; --c3:#db2777; --c4:#ea580c; --c5:#dc2626;
    --c6:#0891b2; --c7:#4f46e5; --c8:#b45309; --c9:#e11d48; --c10:#0ea5e9;
    --bg:#f1f5f9; --panel:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
    --radius:14px;
    --shadow:0 4px 16px rgba(15,23,42,.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{
    background:linear-gradient(120deg,var(--c1),var(--c2) 60%,var(--c3));
    color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
    box-shadow:var(--shadow);position:sticky;top:0;z-index:50;
  }
  header h1{margin:0;font-size:1.35rem;font-weight:700;}
  header .sub{font-size:.8rem;opacity:.9;}
  .sync-box{display:flex;align-items:center;gap:10px;font-size:.8rem;}
  .sync-dot{width:9px;height:9px;border-radius:50%;background:#94a3b8;}
  .sync-dot.ok{background:#4ade80;}
  .sync-dot.bad{background:#f87171;}
  .sync-dot.loading{background:#facc15;animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .icon-btn{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem;}
  .icon-btn:hover{background:rgba(255,255,255,.3);}

  nav.tabs{
    display:flex;gap:6px;padding:10px 20px;background:#e9edf5;flex-wrap:wrap;position:sticky;top:64px;z-index:40;
    box-shadow:inset 0 -1px 0 var(--line);
  }
  nav.tabs button{
    border:none;background:#fff;color:var(--muted);padding:9px 18px;border-radius:999px;cursor:pointer;
    font-weight:600;font-size:.88rem;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:.15s;
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{background:var(--c1);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.35);}

  main{padding:14px;max-width:1500px;margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block;animation:fadeIn .2s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;margin-bottom:14px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .toolbar .left{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    border:none;border-radius:9px;padding:10px 16px;font-weight:600;font-size:.85rem;cursor:pointer;color:#fff;
    background:var(--c1);box-shadow:0 2px 6px rgba(37,99,235,.3);transition:.15s;
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn.secondary{background:var(--c6);}
  .btn.danger{background:var(--c5);}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;}
  .btn.small{padding:4px 8px;font-size:.72rem;}
  .btn.icon-only{padding:3px 6px;font-size:.85rem;line-height:1;}

  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    border-radius:12px;padding:10px 14px;color:#fff;font-size:.8rem;min-width:120px;box-shadow:var(--shadow);
  }
  .chip b{display:block;font-size:1.3rem;}

  .table-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);}
  table{border-collapse:collapse;width:100%;font-size:.76rem;table-layout:auto;}
  thead th{color:#fff;padding:6px 7px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;font-weight:600;}
  thead th .arrow{font-size:.68rem;opacity:.85;margin-left:3px;}
  thead tr.filters th{background:#f8fafc;padding:4px 5px;cursor:default;}
  thead tr.filters input, thead tr.filters select{
    width:100%;padding:3px 4px;border:1px solid var(--line);border-radius:5px;font-size:.7rem;color:var(--ink);background:#fff;
  }
  tbody td{padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody tr:nth-child(odd){background:#ffffff;}
  tbody tr:nth-child(even){background:#eef1f6;}
  tbody tr:hover{background:#dbeafe;}
  tbody tr.clickable{cursor:pointer;}
  .badge{display:inline-block;padding:2px 6px;border-radius:999px;font-size:.68rem;font-weight:700;color:#fff;white-space:nowrap;}
  .badge.TB{background:var(--ok);}
  .badge.S{background:var(--c1);}
  .badge.nonreussi{background:var(--bad);}
  .badge.Oui{background:var(--ok);}
  .badge.Non{background:var(--bad);}
  .badge.empty{background:#cbd5e1;color:#475569;}
  .badge.grpFort{background:var(--ok);}
  .badge.grpMoyen{background:var(--warn);}
  .badge.grpNonNageur{background:var(--bad);}
  .badge.sexeF{background:var(--c3);}
  .badge.sexeG{background:var(--c1);}

  .empty-state{padding:40px;text-align:center;color:var(--muted);}

  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
  .stat-card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
  .stat-card h3{margin:0 0 12px;font-size:1.05rem;}
  .stat-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;}
  .stat-tile{border-radius:10px;padding:10px;color:#fff;text-align:center;}
  .stat-tile b{display:block;font-size:1.4rem;}
  .stat-tile span{font-size:.68rem;opacity:.9;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;
    padding:14px;z-index:100;
  }
  .overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:16px;max-width:960px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);
    overflow:hidden;display:flex;flex-direction:column;max-height:92vh;
  }
  .modal-header{background:linear-gradient(120deg,var(--c1),var(--c7));color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;}
  .modal-header h2{margin:0;font-size:1.05rem;}
  .modal-header .close{background:transparent;border:none;color:#fff;font-size:1.4rem;cursor:pointer;line-height:1;}
  .modal-body{padding:10px 18px 14px;overflow-y:auto;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch;font-size:.9rem;}
  .test-type-toggle{display:flex;gap:6px;margin-bottom:8px;position:sticky;top:-10px;background:#fff;padding-top:10px;z-index:5;}
  .tt-btn{
    flex:1;padding:8px;border-radius:9px;border:2px solid var(--line);background:#f8fafc;
    font-weight:700;font-size:.82rem;cursor:pointer;color:var(--muted);transition:.15s;
  }
  .tt-btn:hover{border-color:var(--c1);}
  .tt-btn.active{background:var(--c1);color:#fff;border-color:var(--c1);box-shadow:0 3px 10px rgba(37,99,235,.3);}
  .test-section{display:none;}
  .test-section.active{display:block;}
  .section-title{font-size:.92rem;font-weight:700;margin:0 0 2px;display:flex;align-items:center;gap:6px;}
  .note{background:#fef3c7;color:#92400e;border-radius:7px;padding:5px 10px;font-size:.72rem;margin:4px 0 8px;}
  .field-row{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid #f1f5f9;}
  .field-row label{font-weight:600;font-size:.8rem;}
  .field-row .desc{font-weight:400;color:var(--muted);font-size:.68rem;display:block;margin-top:2px;}
  .field-row select, .field-row input{
    padding:6px;border:1px solid var(--line);border-radius:7px;font-size:.8rem;width:100%;
  }
  .criteria-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  .criteria-col{min-width:0;}
  .field-row-cb{padding:3px 0;border-bottom:1px solid #f1f5f9;}
  .field-row-cb > label{font-weight:700;font-size:.74rem;display:block;margin-bottom:2px;}
  .inline-row input[type="date"]{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:.8rem;}
  .cb-group{display:flex;gap:5px;flex-wrap:wrap;}
  .cb-group.nowrap{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px;}
  .cb-group.nowrap .cb-opt{flex:0 0 auto;}
  .cb-opt{
    display:flex;flex-direction:column;align-items:center;gap:0;
    border:2px solid var(--line);border-radius:8px;padding:3px 6px;cursor:pointer;
    min-width:68px;text-align:center;background:#f8fafc;transition:.15s;position:relative;
  }
  .cb-group.wide .cb-opt{min-width:96px;padding:7px 12px;}
  .cb-group.wide .code{font-size:.78rem;}
  .cb-opt:hover{border-color:var(--c1);}
  .cb-opt input{display:none;}
  .cb-opt .emoji{font-size:1rem;line-height:1.1;}
  .cb-opt .code{font-weight:800;font-size:.7rem;color:var(--ink);letter-spacing:.02em;}
  .cb-opt small{font-weight:400;color:var(--muted);font-size:.54rem;line-height:1.05;max-width:96px;}
  .cb-opt.checked{box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .inline-row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding:4px 0 5px;border-bottom:1px solid #f1f5f9;}
  .inline-row .inline-item{display:flex;flex-direction:column;gap:3px;}
  .inline-row .inline-item > label{font-weight:700;font-size:.74rem;}
  .inline-row .niveau-item{margin-left:auto;}
  .inline-row .niveau-item span{font-size:.85rem;}
  .cb-opt[data-val="TB"].checked{background:#dcfce7;border-color:var(--ok);}
  .cb-opt[data-val="TB"].checked .code{color:#15803d;}
  .cb-opt[data-val="S"].checked{background:#dbeafe;border-color:var(--c1);}
  .cb-opt[data-val="S"].checked .code{color:#1d4ed8;}
  .cb-opt[data-val="F"].checked{background:#ffedd5;border-color:var(--warn);}
  .cb-opt[data-val="F"].checked .code{color:#c2410c;}
  .cb-opt[data-val="I"].checked{background:#fee2e2;border-color:var(--bad);}
  .cb-opt[data-val="I"].checked .code{color:#b91c1c;}
  .cb-opt[data-val="Oui"].checked{background:#dcfce7;border-color:var(--ok);}
  .cb-opt[data-val="Oui"].checked .code{color:#15803d;}
  .cb-opt[data-val="Non"].checked{background:#fee2e2;border-color:var(--bad);}
  .cb-opt[data-val="Non"].checked .code{color:#b91c1c;}
  .cb-opt[data-val="Avec ceinture"].checked{background:#dbeafe;border-color:var(--c1);}
  .cb-opt[data-val="Avec ceinture"].checked .code{color:#1d4ed8;}
  .cb-opt[data-val="Sans ceinture"].checked{background:#ffedd5;border-color:var(--c4);}
  .cb-opt[data-val="Sans ceinture"].checked .code{color:#c2410c;}
  .meta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .meta-row div{display:flex;flex-direction:column;gap:2px;}
  .meta-row label{font-size:.72rem;font-weight:600;color:var(--muted);}
  hr.sep{border:none;border-top:2px dashed var(--line);margin:12px 0;}
  .modal-footer{padding:10px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex:0 0 auto;}

  @media (max-width:700px){
    header{padding:12px 14px;}
    header h1{font-size:1.05rem;}
    main{padding:12px;}
    .field-row{grid-template-columns:1fr;}
    .meta-row{grid-template-columns:1fr;}
    .criteria-grid{grid-template-columns:1fr;}
    nav.tabs{top:58px;padding:8px 10px;}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>EPS Natation : Savoir Nager pour l'année 2026-2027</h1>
    <div class="sub">Suivi partagé de la validation du savoir nager et du pass nautique</div>
  </div>
  <div class="sync-box">
    <span class="sync-dot" id="syncDot"></span>
    <span id="syncLabel">Non configuré</span>
    <button class="icon-btn" id="btnRefresh" title="Rafraîchir">⟳ Rafraîchir</button>
  </div>
</header>

<nav class="tabs" id="tabsNav"></nav>

<main>
  <div class="panel" id="panel-general"></div>
  <div class="panel" id="panel-6eme1"></div>
  <div class="panel" id="panel-6eme2"></div>
  <div class="panel" id="panel-6eme3"></div>
  <div class="panel" id="panel-6eme4"></div>
  <div class="panel" id="panel-stats"></div>
</main>

<!-- Modal saisie élève -->
<div class="overlay" id="studentOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Élève</h2>
      <button class="close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn ghost" id="modalCancel">Annuler</button>
      <button class="btn" id="modalSave">💾 Enregistrer</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
'use strict';

/* ---------------------------------------------------------- CONFIG ---- */
const CLASSES = ['6ème1','6ème2','6ème3','6ème4'];
const PROFS = ['Joud','Mekraldi','Crozier'];
const PALETTE = ['#2563eb','#7c3aed','#db2777','#ea580c','#dc2626','#0891b2','#4f46e5','#b45309','#e11d48','#0ea5e9','#65a30d'.replace('65a30d','2563eb')];
// (dernier remplacé pour éviter le vert si jamais utilisé au-delà de 10 colonnes)

const SN_CRITERIA = [
  {key:'sn_entree', label:"Entrée dans l'eau", opt:{TB:"Chute arrière sans paniquer", S:"Chute arrière", F:"Saut avec frite", I:"Descente à l'échelle"}},
  {key:'sn_deplacement_aller', label:"Déplacement ventral 3m50 (aller)", opt:{TB:"Crawl aligné", S:"Corps oblique", F:"S'arrête", I:"Impossible"}},
  {key:'sn_immersion_aller', label:"Immersion 1m50 (aller)", opt:{TB:"Plongeon canard", S:"Franchissement sans le toucher", F:"Reprise d'air ou touche l'obstacle", I:"Impossible"}},
  {key:'sn_nage_ventrale', label:"Nage ventrale sur 20m", opt:{TB:"Crawl aligné", S:"Corps oblique", F:"S'arrête", I:"Impossible"}},
  {key:'sn_maintien_vertical', label:"Maintien vertical", opt:{TB:"Flottaison calme et maîtrisée 15 sec", S:"Flottaison 15 sec", F:"Flottaison < à 10 sec", I:"Flottaison < 5 sec"}},
  {key:'sn_demi_tour', label:"Demi-tour", opt:{TB:"Passage ventral dorsal gainé", S:"Passage avec perte de gainage", F:"Passage en touchant le mur", I:"En s'aidant du mur"}},
  {key:'sn_nage_dorsale', label:"Nage dorsale sur 20m", opt:{TB:"Dos crawlé aligné", S:"Dos oblique ou sans bras", F:"S'arrête", I:"Impossible"}},
  {key:'sn_etoile_dorsale', label:"Étoile dorsale", opt:{TB:"15 sec stable", S:"15 sec mais jambes qui descendent", F:"Étoile tenue < 10 sec", I:"Étoile tenue < 5 sec"}},
  {key:'sn_immersion_retour', label:"Immersion 1m50 (retour)", opt:{TB:"Plongeon canard", S:"Franchissement sans le toucher", F:"Reprise d'air ou touche l'obstacle", I:"Impossible"}},
  {key:'sn_deplacement_retour', label:"Déplacement ventral 3m50 (retour)", opt:{TB:"Crawl aligné", S:"Corps oblique", F:"S'arrête", I:"Impossible"}},
];

// Ordre d'affichage demandé dans le formulaire (2 colonnes), indépendant de
// l'ordre de calcul ci-dessus. 'sn_ancrage' est Oui/Non, traité à part dans openModal.
const SN_COLUMN_1 = ['sn_entree','sn_deplacement_aller','sn_immersion_aller','sn_nage_ventrale','sn_maintien_vertical'];
const SN_COLUMN_2 = ['sn_demi_tour','sn_nage_dorsale','sn_etoile_dorsale','sn_immersion_retour','sn_deplacement_retour','sn_ancrage'];
const SN_CRITERIA_BY_KEY = Object.fromEntries(SN_CRITERIA.map(c=>[c.key,c]));

const PN_CRITERIA = [
  {key:'pn_entree_saut', label:"Entrée dans l'eau par un saut"},
  {key:'pn_maintien_vertical', label:"Maintien vertical 5 sec"},
  {key:'pn_etoile_dorsale', label:"Étoile dorsale 5 sec"},
  {key:'pn_nage_ventrale', label:"Nage ventrale 20m"},
  {key:'pn_immersion', label:"Immersion"},
];

const LEVEL_EMOJI = {
  TB:'🏊', S:'🟢', F:'🟡', I:'🔴',
  Oui:'✅', Non:'🚫',
  'Avec ceinture':'🦺', 'Sans ceinture':'🙅',
  Joud:'🧑‍🏫', Mekraldi:'🧑‍🏫', Crozier:'🧑‍🏫',
};

const FIELDS = ['id','nom','prenom','classe','sexe','groupe',
  ...SN_CRITERIA.map(c=>c.key), 'sn_ancrage','sn_prof','sn_date','sn_niveau',
  ...PN_CRITERIA.map(c=>c.key), 'pn_ceinture','pn_prof','pn_date','pn_valide'];

/* ------------------------------------------------------------ STATE --- */
// URL du déploiement Apps Script. En cas de migration vers un nouveau
// déploiement, changez cette valeur ici et re-publiez le fichier sur GitHub.
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzotQG2_sbZoiRWTZvKeZUTi-5331c2dQytUxiscYLlxaEojmF0ouCkzAZR1IFqfdNF/exec';
let STUDENTS = [];
let currentTab = 'general';
let currentEditId = null;
const tableState = {}; // { tableId: { sortKey, sortDir, filters:{} } }
// Après un échec réseau, on évite de retenter l'envoi direct pendant ce délai
// (évite de faire attendre le timeout complet à chaque enregistrement hors-ligne).
let assumeOfflineUntil = 0;

/* -------------------------------------------------------------- API --- */
function setSync(state, label){
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + state;
  document.getElementById('syncLabel').textContent = label;
}

async function fetchWithTimeout(url, options={}, timeoutMs=6000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url, {...options, signal: controller.signal});
  }catch(err){
    if(err.name === 'AbortError') throw new Error('Délai dépassé (hors ligne ?)');
    throw err;
  }finally{
    clearTimeout(timer);
  }
}

async function apiGetAll(){
  if(!APPS_SCRIPT_URL) throw new Error('URL non configurée');
  const res = await fetchWithTimeout(APPS_SCRIPT_URL + '?action=getAll');
  if(!res.ok) throw new Error('Erreur réseau ' + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.students || [];
}

async function apiPost(payload){
  if(!APPS_SCRIPT_URL) throw new Error('URL non configurée');
  const res = await fetchWithTimeout(APPS_SCRIPT_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
  if(!res.ok) throw new Error('Erreur réseau ' + res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

function saveCache(){
  localStorage.setItem('nsn_students_cache', JSON.stringify(STUDENTS));
  localStorage.setItem('nsn_last_sync', new Date().toISOString());
}
function loadCache(){
  try{
    const raw = localStorage.getItem('nsn_students_cache');
    if(raw) STUDENTS = JSON.parse(raw);
  }catch(e){ STUDENTS = []; }
}

/* ------------------------------------------------------ PENDING QUEUE - */
// File d'attente locale des résultats saisis hors-ligne, en attente d'envoi
// au Google Sheet. Clé = id élève -> dernière version saisie non synchronisée.
function loadPendingQueue(){
  try{ return JSON.parse(localStorage.getItem('nsn_pending_saves') || '{}'); }
  catch(e){ return {}; }
}
function savePendingQueue(queue){
  localStorage.setItem('nsn_pending_saves', JSON.stringify(queue));
}
function queueSave(draft){
  const queue = loadPendingQueue();
  queue[draft.id] = draft;
  savePendingQueue(queue);
}
function pendingCount(){
  return Object.keys(loadPendingQueue()).length;
}
function upsertLocalStudent(draft){
  const idx = STUDENTS.findIndex(x=>x.id===draft.id);
  if(idx >= 0) STUDENTS[idx] = draft; else STUDENTS.push(draft);
}

async function flushPendingQueue(){
  const queue = loadPendingQueue();
  const ids = Object.keys(queue);
  if(!ids.length) return;
  setSync('loading', `Envoi de ${ids.length} résultat(s) en attente...`);
  for(const id of ids){
    try{
      const res = await apiPost({action:'saveStudent', data: queue[id]});
      STUDENTS = res.students;
      delete queue[id];
      savePendingQueue(queue);
    }catch(err){
      saveCache();
      renderAll();
      setSync('bad', `Hors ligne — ${Object.keys(queue).length} résultat(s) en attente d'envoi`);
      return;
    }
  }
  saveCache();
}

async function syncNow(){
  await flushPendingQueue();
  await refreshAll();
}

async function refreshAll(showLoading=true){
  if(showLoading) setSync('loading','Synchronisation...');
  try{
    STUDENTS = await apiGetAll();
    assumeOfflineUntil = 0;
    // Réapplique les éventuelles saisies hors-ligne pas encore envoyées, pour
    // ne jamais les faire disparaître de l'écran tant qu'elles ne sont pas synchronisées.
    const queue = loadPendingQueue();
    Object.values(queue).forEach(draft => upsertLocalStudent(draft));
    saveCache();
    const nbPending = Object.keys(queue).length;
    setSync(nbPending?'bad':'ok', nbPending ? `Hors ligne — ${nbPending} résultat(s) en attente d'envoi` : 'Synchronisé ' + new Date().toLocaleTimeString());
    renderAll();
    return true;
  }catch(err){
    assumeOfflineUntil = Date.now() + 20000;
    setSync('bad', pendingCount() ? `Hors ligne — ${pendingCount()} résultat(s) en attente d'envoi` : 'Hors ligne (' + err.message + ')');
    renderAll();
    return false;
  }
}

/* ------------------------------------------------------------ UTILS --- */
function computeNiveauSN(s){
  const vals = SN_CRITERIA.map(c=>s[c.key]).filter(v=>v);
  if(vals.length < SN_CRITERIA.length) return '';
  if(vals.some(v=>v==='F'||v==='I')) return 'Non réussi';
  const tb = vals.filter(v=>v==='TB').length;
  const sc = vals.filter(v=>v==='S').length;
  return tb > sc ? 'TB' : 'S';
}
function computeValidePN(s){
  const vals = PN_CRITERIA.map(c=>s[c.key]).filter(v=>v);
  if(vals.length < PN_CRITERIA.length) return '';
  return vals.every(v=>v==='Oui') ? 'Oui' : 'Non';
}
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmtDate(iso){
  if(!iso) return '';
  const parts = String(iso).split('-');
  if(parts.length===3) return parts[2]+'/'+parts[1]+'/'+parts[0];
  return iso;
}
function isGarcon(s){
  const v = String(s.sexe||'').trim().toUpperCase();
  return v==='G' || v==='M';
}
function isFille(s){
  return String(s.sexe||'').trim().toUpperCase()==='F';
}
function aReussi(s){
  return s.sn_niveau==='TB' || s.sn_niveau==='S' || s.pn_valide==='Oui';
}
function computeStats(rows){
  return {
    nb: rows.length,
    filles: rows.filter(isFille).length,
    garcons: rows.filter(isGarcon).length,
    groupeFort: rows.filter(s=>s.groupe==='Fort').length,
    groupeMoyen: rows.filter(s=>s.groupe==='Moyen').length,
    nonNageurs: rows.filter(s=>s.groupe==='Non nageur').length,
    validesSN: rows.filter(s=>s.sn_niveau==='TB'||s.sn_niveau==='S').length,
    validesPN: rows.filter(s=>s.pn_valide==='Oui').length,
    nonNageursFillesReussi: rows.filter(s=>s.groupe==='Non nageur' && isFille(s) && aReussi(s)).length,
    nonNageursGarconsReussi: rows.filter(s=>s.groupe==='Non nageur' && isGarcon(s) && aReussi(s)).length,
  };
}
function niveauBadge(v){
  if(!v) return '<span class="badge empty">— À évaluer</span>';
  if(v==='Non réussi') return '<span class="badge nonreussi">🔴 Non réussi</span>';
  return '<span class="badge '+v+'">'+(LEVEL_EMOJI[v]||'')+' '+v+'</span>';
}
function ouiNonBadge(v){
  if(!v) return '<span class="badge empty">— À évaluer</span>';
  return '<span class="badge '+v+'">'+(LEVEL_EMOJI[v]||'')+' '+v+'</span>';
}
function groupeBadge(v){
  if(!v) return '<span class="badge empty">—</span>';
  const cls = {'Fort':'grpFort', 'Moyen':'grpMoyen', 'Non nageur':'grpNonNageur'}[v] || 'empty';
  const emoji = {'Fort':'💪', 'Moyen':'🟡', 'Non nageur':'🔴'}[v] || '';
  return '<span class="badge '+cls+'">'+emoji+' '+v+'</span>';
}
function sexeBadge(v){
  const norm = String(v||'').trim().toUpperCase();
  if(norm==='F') return '<span class="badge sexeF">F</span>';
  if(norm==='G' || norm==='M') return '<span class="badge sexeG">G</span>';
  return '<span class="badge empty">—</span>';
}

/* Generic sortable/filterable table builder */
function buildTable(tableId, columns, rows, opts={}){
  if(!tableState[tableId]) tableState[tableId] = {sortKey:'nom', sortDir:1, filters:{}};
  const st = tableState[tableId];

  let filtered = rows.filter(r=>{
    return columns.every(col=>{
      const f = st.filters[col.key];
      if(!f) return true;
      const val = String(col.getValue(r) ?? '').toLowerCase();
      return val.includes(String(f).toLowerCase());
    });
  });

  if(st.sortKey){
    const col = columns.find(c=>c.key===st.sortKey);
    filtered.sort((a,b)=>{
      const va = String(col.getValue(a) ?? '');
      const vb = String(col.getValue(b) ?? '');
      return va.localeCompare(vb, 'fr') * st.sortDir;
    });
  }

  const headerCells = columns.map((col,i)=>{
    const color = PALETTE[i % PALETTE.length];
    const arrow = st.sortKey===col.key ? (st.sortDir===1?'▲':'▼') : '';
    return `<th style="background:${color}" data-key="${col.key}">${col.label}<span class="arrow">${arrow}</span></th>`;
  }).join('');

  const filterCells = columns.map(col=>{
    if(col.filterType==='select'){
      const options = (col.filterOptions||[]).map(o=>`<option value="${o}" ${st.filters[col.key]===o?'selected':''}>${o}</option>`).join('');
      return `<th><select data-filter-key="${col.key}"><option value="">Tous</option>${options}</select></th>`;
    }
    if(col.filterType===false) return `<th></th>`;
    return `<th><input type="text" data-filter-key="${col.key}" value="${st.filters[col.key]||''}" placeholder="Filtrer..."></th>`;
  }).join('');

  const bodyRows = filtered.length ? filtered.map(row=>{
    const cells = columns.map(col=>`<td>${col.render ? col.render(row) : (col.getValue(row) ?? '')}</td>`).join('');
    return `<tr class="${opts.rowClickable?'clickable':''}" data-id="${row.id}">${cells}</tr>`;
  }).join('') : `<tr><td colspan="${columns.length}" class="empty-state">Aucun élève ne correspond.</td></tr>`;

  const html = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>${headerCells}</tr>
          <tr class="filters">${filterCells}</tr>
        </thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>`;
  return {html, filtered};
}

function wireTable(container, tableId, columns, opts={}){
  const st = tableState[tableId];
  container.querySelectorAll('thead th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(st.sortKey===key) st.sortDir *= -1; else { st.sortKey = key; st.sortDir = 1; }
      opts.rerender();
    });
  });
  container.querySelectorAll('[data-filter-key]').forEach(el=>{
    el.addEventListener(el.tagName==='SELECT' ? 'change':'input', ()=>{
      st.filters[el.dataset.filterKey] = el.value;
      opts.rerender();
    });
  });
  if(opts.rowClickable){
    container.querySelectorAll('tbody tr[data-id]').forEach(tr=>{
      tr.addEventListener('click', (e)=>{
        if(e.target.closest('button')) return;
        openModal(tr.dataset.id);
      });
    });
  }
  container.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      deleteStudentPrompt(btn.dataset.id);
    });
  });
  container.querySelectorAll('[data-action="export"]').forEach(btn=>{
    btn.addEventListener('click', ()=> exportExcel(opts.exportRows(), opts.exportName));
  });
}

function exportExcel(rows, filename){
  const data = rows.map(r=>({
    Nom:r.nom, Prénom:r.prenom, Classe:r.classe, Sexe:r.sexe, 'Groupe':r.groupe||'',
    'Niveau Savoir Nager':r.sn_niveau||'', 'Date SN':fmtDate(r.sn_date), 'Prof SN':r.sn_prof||'',
    'Pass Nautique':r.pn_valide||'', 'Date PN':fmtDate(r.pn_date), 'Prof PN':r.pn_prof||'',
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Export');
  XLSX.writeFile(wb, filename);
}

function cbOptionsHtml(field, current, options, extra={}){
  const opts = options.map(([val,text,desc])=>{
    const isChecked = current === val;
    const emoji = LEVEL_EMOJI[val] || '❔';
    return `
      <label class="cb-opt ${isChecked?'checked':''}" data-val="${val}">
        <input type="checkbox" data-value="${val}" ${isChecked?'checked':''}>
        <span class="emoji">${emoji}</span>
        <span class="code">${text}</span>
        ${desc?`<small>${desc}</small>`:''}
      </label>`;
  }).join('');
  const cls = ['cb-group', extra.nowrap?'nowrap':'', extra.wide?'wide':''].filter(Boolean).join(' ');
  return `<div class="${cls}" data-field="${field}">${opts}</div>`;
}
function choiceGroup(label, field, current, options, extra={}){
  return `
    <div class="field-row-cb">
      <label>${label}</label>
      ${cbOptionsHtml(field, current, options, extra)}
    </div>`;
}
function snFieldGroup(c, current){
  return choiceGroup(c.label, c.key, current, Object.entries(c.opt).map(([k,desc])=>[k,k,desc]), {nowrap: c.key==='sn_demi_tour'});
}
function ouiNonGroup(label, field, current){
  return choiceGroup(label, field, current, [['Oui','Oui'],['Non','Non']]);
}

function wireChoiceGroups(onChange){
  document.querySelectorAll('#modalBody .cb-group').forEach(group=>{
    const boxes = group.querySelectorAll('input[type=checkbox]');
    boxes.forEach(input=>{
      input.addEventListener('change', ()=>{
        if(input.checked){
          boxes.forEach(other=>{ if(other!==input) other.checked = false; });
        }
        group.querySelectorAll('.cb-opt').forEach(lbl=>{
          lbl.classList.toggle('checked', lbl.querySelector('input').checked);
        });
        onChange();
      });
    });
  });
}

function autofillDates(base){
  const draft = collectDraft(base);
  const snDateInput = document.querySelector('#modalBody [data-field="sn_date"]');
  const pnDateInput = document.querySelector('#modalBody [data-field="pn_date"]');
  const hasSNInput = SN_CRITERIA.some(c=>draft[c.key]) || draft.sn_ancrage || draft.sn_prof;
  const hasPNInput = PN_CRITERIA.some(c=>draft[c.key]) || draft.pn_ceinture || draft.pn_prof;
  if(snDateInput && !snDateInput.value && hasSNInput) snDateInput.value = todayISO();
  if(pnDateInput && !pnDateInput.value && hasPNInput) pnDateInput.value = todayISO();
}

function collectDraft(base){
  const draft = {...base};
  document.querySelectorAll('#modalBody .cb-group[data-field]').forEach(group=>{
    const checked = group.querySelector('input[type=checkbox]:checked');
    draft[group.dataset.field] = checked ? checked.dataset.value : '';
  });
  document.querySelectorAll('#modalBody select[data-field], #modalBody input[type=date][data-field]').forEach(el=>{
    draft[el.dataset.field] = el.value;
  });
  return draft;
}

  if(SN_CRITERIA.some(c=>draft[c.key]) && !draft.sn_date) draft.sn_date = todayISO();
  if(PN_CRITERIA.some(c=>draft[c.key]) && !draft.pn_date) draft.pn_date = todayISO();
  draft.sn_niveau = computeNiveauSN(draft);
  draft.pn_valide = computeValidePN(draft);

  const btn = document.getElementById('modalSave');
  btn.disabled = true; btn.textContent = 'Enregistrement...';

  if(Date.now() < assumeOfflineUntil){
    // Échec réseau récent : on n'attend pas un nouveau timeout, on passe direct au mode local.
    upsertLocalStudent(draft);
    queueSave(draft);
    saveCache();
    renderAll();
    closeModal();
    setSync('bad', `Hors ligne — ${pendingCount()} résultat(s) en attente d'envoi (enregistré localement)`);
    btn.disabled = false; btn.textContent = '💾 Enregistrer';
    return;
  }

  try{
    await refreshAll(false); // récupérer les dernières données avant d'écrire (échoue silencieusement si hors ligne)
    const res = await apiPost({action:'saveStudent', data:draft});
    STUDENTS = res.students;
    saveCache();
    assumeOfflineUntil = 0;
    setSync('ok','Synchronisé ' + new Date().toLocaleTimeString());
    renderAll();
    closeModal();
  }catch(err){
    // Hors ligne ou erreur réseau : on enregistre quand même localement,
    // la synchronisation se fera automatiquement au retour de la connexion.
    assumeOfflineUntil = Date.now() + 20000;
    upsertLocalStudent(draft);
    queueSave(draft);
    saveCache();
    renderAll();
    closeModal();
    setSync('bad', `Hors ligne — ${pendingCount()} résultat(s) en attente d'envoi (enregistré localement)`);
  }finally{
    btn.disabled = false; btn.textContent = '💾 Enregistrer';
  }
}

async function deleteStudentPrompt(id){
  const s = STUDENTS.find(x=>x.id===id);
  if(!s) return;
  if(!confirm(`Supprimer définitivement ${s.nom} ${s.prenom} (${s.classe}) ?`)) return;
  try{
    setSync('loading','Suppression...');
    const res = await apiPost({action:'deleteStudent', id});
    STUDENTS = res.students;
    saveCache();
    setSync('ok','Synchronisé ' + new Date().toLocaleTimeString());
    renderAll();
  }catch(err){
    alert('Erreur lors de la suppression : ' + err.message);
    setSync('bad','Erreur de synchro');
  }
}

async function importCollegeList(){
  try{
    setSync('loading','Import en cours...');
    const res = await apiPost({action:'importFromCollege'});
    STUDENTS = res.students;
    saveCache();
    setSync('ok','Synchronisé ' + new Date().toLocaleTimeString());
    renderAll();
    alert(`Import terminé : ${res.added} élève(s) ajouté(s), ${res.updated} déjà inscrit(s) et mis à jour (classe/sexe/non-nageur).`);
  }catch(err){
    alert("Erreur lors de l'import : " + err.message);
    setSync('bad','Erreur de synchro');
  }
}

/* -------------------------------------------------------------- INIT -- */
function wireGlobalEvents(){
  document.getElementById('btnRefresh').addEventListener('click', ()=>syncNow());
  window.addEventListener('online', ()=>syncNow());
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', saveModal);
  document.getElementById('studentOverlay').addEventListener('click', (e)=>{
    if(e.target.id==='studentOverlay') closeModal();
  });
}

document.addEventListener('DOMContentLoaded', ()=>{
  loadCache();
  initTabs();
  wireGlobalEvents();
  renderAll();
  if(pendingCount()) setSync('bad', `Hors ligne — ${pendingCount()} résultat(s) en attente d'envoi`);
  syncNow();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
});
</script>
